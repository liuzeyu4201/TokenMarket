# TokenMarket gitleaks configuration.
# Only exact inert fixture values are allowlisted. Path-wide exclusions of
# tests, Go tests, specs, or docs are forbidden: a real secret in those trees
# must fail make security-check.

title = "TokenMarket"

[extend]
useDefault = true

[allowlist]
description = "Exact inert fixture values only (never path-wide trees)"
regexes = [
  '''^local-dev-only-token$''',
  '''^sk-synthetic-test-key-not-real$''',
  '''^sk-replace-me$''',
  '''^sk-live-abc123$''',
  '''^sk-1234567890abcdef$''',
  '''^sk-proj-\.\.\.$''',
  '''^sk-ant-\.\.\.$''',
  '''^sk-\.\.\.$''',
  '''^dev-only-proxy-pepper-not-for-prod$''',
  '''^tmk-0123456789abcdef0123456789abcdef$''',
  '''^sk-abcdefghijklmnopqrstuvwxyz1234$''',
  '''^sk-abcdefghijklmnopqrstuvwxyz1234567890$''',
  '''^dGhlIHNhbXBsZSBub25jZQ==$''',  # RFC 6455 sample Sec-WebSocket-Key (not a credential)
]
