[project]
name = "billing-service"
version = "0.1.0"
description = "TokenMarket Billing service scaffold"
requires-python = "==3.11.*"
dependencies = [
    "fastapi ~=0.115.0",
    "pydantic ~=2.10.0",
    "pydantic-settings ~=2.7.0",
    "uvicorn[standard] ~=0.34.0",
    "prometheus-client ~=0.21.0",
    "alembic ~=1.14.0",
    "sqlalchemy[asyncio] ~=2.0.36",
    "asyncpg ~=0.30.0",
    "psycopg2-binary ~=2.9.0",
]

[dependency-groups]
dev = [
    "pytest ~=8.3.0",
    "pytest-asyncio ~=0.24.0",
    "httpx ~=0.28.0",
    "black ~=24.10.0",
    "isort ~=5.13.0",
    "flake8 ~=7.1.0",
    "mypy ~=1.13.0",
    "coverage ~=7.6.0",
    "pytest-cov ~=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.uv]
managed = true
