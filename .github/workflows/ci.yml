name: quality-gate

on:
  push:
    branches: ["master", "master-dev"]
  pull_request:
    branches: ["master", "master-dev"]
  merge_group:
    branches: ["master", "master-dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    env:
      # Explicit hosted toolchain profile (ADR 004). GITHUB_ACTIONS and
      # RUNNER_OS are provided by the runner and must not be forged here.
      TOKENMARKET_TOOLCHAIN_PROFILE: github-actions-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.25.12"

      - name: Set up Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "24.18.0"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.3"

      - name: Integrity scan
        run: make toolchain-check

      - name: CI gate
        run: make ci
