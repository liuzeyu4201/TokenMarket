openapi: 3.0.3
info:
  title: TokenMarket Provider Connection (SF14)
  version: 1.1.0
  description: |
    凭据只在创建/替换请求出现一次。响应与列表不得包含明文。无 read-back 路径。
    解密仅内部 unwrap。1.1.0 兼容扩展：列表、替换、删除、内部 unwrap、SSRF。
paths:
  /api/v1/provider-connections:
    post:
      operationId: createProviderConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderConnectionRequest"
      responses:
        "201":
          description: 已创建（无明文）
        "403":
          description: 非卖家工作区
        "400":
          description: SSRF 或字段校验
    get:
      operationId: listProviderConnections
      responses:
        "200":
          description: 元数据列表，无明文
  /api/v1/provider-connections/{connection_id}:
    get:
      operationId: getProviderConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 元数据
        "404":
          description: 同形不存在
    delete:
      operationId: deleteProviderConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 已删除，密文销毁
  /api/v1/provider-connections/{connection_id}/credential:
    put:
      operationId: replaceProviderConnectionCredential
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceCredentialRequest"
      responses:
        "200":
          description: 已整体替换
        "409":
          description: 版本冲突
  /internal/v1/provider-connections/{connection_id}/unwrap:
    post:
      operationId: unwrapProviderConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnwrapRequest"
      responses:
        "200":
          description: 仅内部身份
        "401":
          description: 无内部令牌
        "404":
          description: 已删除或无权
components:
  parameters:
    ConnectionId:
      in: path
      name: connection_id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ProviderName:
      type: string
      enum: [openai, anthropic, vertex]
    SupplyMode:
      type: string
      enum: [shared, dedicated]
    Credential:
      type: object
      additionalProperties: false
      description: write-only；不得在任何响应中回显
      required: [secret]
      properties:
        secret: { type: string, minLength: 1, writeOnly: true }
        project_number: { type: string }
        location: { type: string }
    CreateProviderConnectionRequest:
      type: object
      additionalProperties: false
      required: [provider, supply_mode, credential]
      properties:
        provider: { $ref: "#/components/schemas/ProviderName" }
        supply_mode: { $ref: "#/components/schemas/SupplyMode" }
        region: { type: string }
        purpose: { type: string }
        base_url: { type: string, format: uri }
        credential: { $ref: "#/components/schemas/Credential" }
        idempotency_key: { type: string }
    ReplaceCredentialRequest:
      type: object
      additionalProperties: false
      required: [credential, expected_version]
      properties:
        credential: { $ref: "#/components/schemas/Credential" }
        expected_version: { type: integer, minimum: 1 }
    UnwrapRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { type: string, enum: [proxy, verify] }
    ProviderConnection:
      type: object
      additionalProperties: false
      required:
        - connection_id
        - seller_account_id
        - provider
        - supply_mode
        - credential_fingerprint
        - credential_version
        - status
      properties:
        connection_id: { type: string, format: uuid }
        seller_account_id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/ProviderName" }
        supply_mode: { $ref: "#/components/schemas/SupplyMode" }
        region: { type: string }
        purpose: { type: string }
        base_url: { type: string }
        auth_type: { type: string, enum: [api_key, service_account] }
        project_number: { type: string }
        location: { type: string }
        credential_fingerprint:
          type: string
          minLength: 8
          description: 不可逆指纹；不是密钥
        credential_version: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, deleted] }
      description: 禁止 credential 或 plaintext 读字段。
