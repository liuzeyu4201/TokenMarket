openapi: 3.0.3
info:
  title: TokenMarket Provider Connection (SF14/SF15/SF16)
  version: 1.3.0
  description: |
    凭据只在创建/替换请求出现一次。响应与列表不得包含明文。无 read-back 路径。
    解密仅内部 unwrap。1.3.0 兼容扩展：供给生命周期与模式锁定。
paths:
  /api/v1/provider-connections:
    post:
      operationId: createProviderConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderConnectionRequest"
      responses:
        "201":
          description: 已创建（无明文）
        "403":
          description: 非卖家工作区
        "400":
          description: SSRF 或字段校验
    get:
      operationId: listProviderConnections
      responses:
        "200":
          description: 元数据列表，无明文
  /api/v1/provider-connections/{connection_id}:
    get:
      operationId: getProviderConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 元数据
        "404":
          description: 同形不存在
    delete:
      operationId: deleteProviderConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 已删除，密文销毁
  /api/v1/provider-connections/{connection_id}/credential:
    put:
      operationId: replaceProviderConnectionCredential
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceCredentialRequest"
      responses:
        "200":
          description: 已整体替换
        "409":
          description: 版本冲突
  /internal/v1/provider-connections/{connection_id}/unwrap:
    post:
      operationId: unwrapProviderConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnwrapRequest"
      responses:
        "200":
          description: 仅内部身份
        "401":
          description: 无内部令牌
        "404":
          description: 已删除或无权
  /api/v1/provider-connections/{connection_id}/verify:
    post:
      operationId: verifyProviderConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 验证完成（无明文）
        "403":
          description: 非卖家工作区
  /api/v1/provider-connections/{connection_id}/health:
    get:
      operationId: getProviderConnectionHealth
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 健康快照
  /api/v1/provider-connections/{connection_id}/capabilities:
    get:
      operationId: listProviderConnectionCapabilities
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 版本化能力快照
  /internal/v1/provider-connections/{connection_id}/health:
    get:
      operationId: getInternalProviderConnectionHealth
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 路由用健康事实
        "401":
          description: 无内部令牌
  /api/v1/provider-connections/{connection_id}/list:
    post:
      operationId: listProviderConnectionSupply
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 已上架，模式锁定
        "409":
          description: 非法状态或未验证
  /api/v1/provider-connections/{connection_id}/pause:
    post:
      operationId: pauseProviderConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 已暂停，立即阻止新路由
  /api/v1/provider-connections/{connection_id}/resume:
    post:
      operationId: resumeProviderConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 已恢复
  /api/v1/provider-connections/{connection_id}/drain:
    post:
      operationId: drainProviderConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 排空中
  /api/v1/provider-connections/{connection_id}/retire:
    post:
      operationId: retireProviderConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: 已退役
        "409":
          description: 存在阻塞
  /api/v1/provider-connections/{connection_id}/supply-mode:
    patch:
      operationId: patchProviderConnectionSupplyMode
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [supply_mode]
              properties:
                supply_mode: { $ref: "#/components/schemas/SupplyMode" }
      responses:
        "200":
          description: 仅 draft/verified
        "409":
          description: MODE_LOCKED
  /internal/v1/provider-connections/routable:
    get:
      operationId: listRoutableProviderConnections
      parameters:
        - in: query
          name: supply_mode
          schema: { $ref: "#/components/schemas/SupplyMode" }
      responses:
        "200":
          description: 按模式隔离的可路由连接
        "401":
          description: 无内部令牌
components:
  parameters:
    ConnectionId:
      in: path
      name: connection_id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ProviderName:
      type: string
      enum: [openai, anthropic, vertex]
    SupplyMode:
      type: string
      enum: [shared, dedicated]
    Credential:
      type: object
      additionalProperties: false
      description: write-only；不得在任何响应中回显
      required: [secret]
      properties:
        secret: { type: string, minLength: 1, writeOnly: true }
        project_number: { type: string }
        location: { type: string }
    CreateProviderConnectionRequest:
      type: object
      additionalProperties: false
      required: [provider, supply_mode, credential]
      properties:
        provider: { $ref: "#/components/schemas/ProviderName" }
        supply_mode: { $ref: "#/components/schemas/SupplyMode" }
        region: { type: string }
        purpose: { type: string }
        base_url: { type: string, format: uri }
        credential: { $ref: "#/components/schemas/Credential" }
        idempotency_key: { type: string }
    ReplaceCredentialRequest:
      type: object
      additionalProperties: false
      required: [credential, expected_version]
      properties:
        credential: { $ref: "#/components/schemas/Credential" }
        expected_version: { type: integer, minimum: 1 }
    UnwrapRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { type: string, enum: [proxy, verify] }
    ProviderConnection:
      type: object
      additionalProperties: false
      required:
        - connection_id
        - seller_account_id
        - provider
        - supply_mode
        - credential_fingerprint
        - credential_version
        - status
      properties:
        connection_id: { type: string, format: uuid }
        seller_account_id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/ProviderName" }
        supply_mode: { $ref: "#/components/schemas/SupplyMode" }
        region: { type: string }
        purpose: { type: string }
        base_url: { type: string }
        auth_type: { type: string, enum: [api_key, service_account] }
        project_number: { type: string }
        location: { type: string }
        credential_fingerprint:
          type: string
          minLength: 8
          description: 不可逆指纹；不是密钥
        credential_version: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, deleted] }
        health_state:
          type: string
          enum: [unknown, healthy, degraded, unhealthy]
        health_reason: { type: string }
        capability_version: { type: integer, minimum: 0 }
        lifecycle_state:
          type: string
          enum: [draft, verified, listed, bound, paused, draining, retired]
      description: 禁止 credential 或 plaintext 读字段。
