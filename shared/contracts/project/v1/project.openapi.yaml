openapi: 3.0.3
info:
  title: TokenMarket Project contract (SF10/SF13)
  version: 1.2.0
  description: |
    版本化 Project 契约。mode 在创建后不可变；禁止 PATCH mode。
    1.1.0 为兼容扩展：列表、重命名、状态机、协议启用/停用、删除阻塞、准入。
    1.2.0：测试额度总览、软硬预算、原生 SDK 引导与用量下钻。无充值、提现。
paths:
  /api/v1/projects:
    post:
      operationId: createProject
      summary: 创建 Project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "403":
          description: 卖家工作区或角色无权
        "409":
          description: 名称冲突
    get:
      operationId: listProjects
      summary: 列出当前账号未删除的 Project
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListEnvelope"
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "404":
          description: 不存在与无权访问同形
    patch:
      operationId: patchProject
      summary: 重命名；请求体不得含 mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProjectRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "400":
          description: MODE_IMMUTABLE 或校验失败
        "404":
          description: 不存在与无权访问同形
    delete:
      operationId: deleteProject
      summary: 逻辑删除；有阻塞项则 409
      responses:
        "200":
          description: 已逻辑终止
        "404":
          description: 不存在与无权访问同形
        "409":
          description: DELETE_BLOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteBlockedEnvelope"
  /api/v1/projects/{project_id}/activate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: activateProject
      responses:
        "200":
          description: 已激活
        "409":
          description: 非法状态转换
        "404":
          description: 不存在与无权访问同形
  /api/v1/projects/{project_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: suspendProject
      responses:
        "200":
          description: 已暂停
        "409":
          description: 非法状态转换
        "404":
          description: 不存在与无权访问同形
  /api/v1/projects/{project_id}/archive:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: archiveProject
      responses:
        "200":
          description: 已归档；随后准入不允许新代理请求
        "409":
          description: 非法状态转换
        "404":
          description: 不存在与无权访问同形
  /api/v1/projects/{project_id}/admission:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectAdmission
      responses:
        "200":
          description: 准入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionEnvelope"
        "404":
          description: 不存在与无权访问同形
  /api/v1/projects/{project_id}/protocols/{protocol}/enable:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ProtocolPath"
    post:
      operationId: enableProjectProtocol
      responses:
        "200":
          description: 已启用
        "409":
          description: PROVIDER_BINDING_REQUIRED 或非法状态
        "404":
          description: 不存在与无权访问同形
  /api/v1/projects/{project_id}/protocols/{protocol}/disable:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ProtocolPath"
    post:
      operationId: disableProjectProtocol
      responses:
        "200":
          description: 已停用（历史行保留）
        "404":
          description: 不存在与无权访问同形
  /api/v1/projects/{project_id}/budget:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectBudget
      responses:
        "200":
          description: 测试额度总览（账本投影）
    put:
      operationId: putProjectBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutBudgetRequest"
      responses:
        "200":
          description: 已保存软/硬阈值
        "409":
          description: HARD_LIMIT 非法
  /api/v1/projects/{project_id}/budget/admit:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: admitProjectBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmitBudgetRequest"
      responses:
        "200":
          description: 允许预留；可能带软告警
        "409":
          description: HARD_LIMIT
  /api/v1/projects/{project_id}/guide:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectGuide
      responses:
        "200":
          description: checklist 与三协议原生示例
  /api/v1/projects/{project_id}/usage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectUsage
      responses:
        "200":
          description: 可筛选用量行，含 request_id
components:
  parameters:
    ProjectId:
      in: path
      name: project_id
      required: true
      schema: { type: string, format: uuid }
    ProtocolPath:
      in: path
      name: protocol
      required: true
      schema: { $ref: "#/components/schemas/ProtocolName" }
  schemas:
    ProjectMode:
      type: string
      enum: [shared, dedicated]
    ProtocolName:
      type: string
      enum: [openai, anthropic, vertex]
    ProjectStatus:
      type: string
      enum: [draft, active, suspended, archived]
    BlockerKind:
      type: string
      enum: [key, in_flight_task, unsettled_ledger]
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [display_name, mode, enabled_protocols]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 128 }
        mode: { $ref: "#/components/schemas/ProjectMode" }
        enabled_protocols:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProtocolName" }
        idempotency_key: { type: string, minLength: 1 }
        preview_opt_in: { type: boolean, default: false }
    PatchProjectRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 128 }
        preview_opt_in: { type: boolean }
      description: 不提供 mode。额外字段（含 mode）必须被拒绝。preview_opt_in 可单独更新。
    ProtocolState:
      type: object
      additionalProperties: false
      required: [protocol, enabled]
      properties:
        protocol: { $ref: "#/components/schemas/ProtocolName" }
        enabled: { type: boolean }
        enabled_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }
    Project:
      type: object
      additionalProperties: false
      required:
        - project_id
        - owner_account_id
        - display_name
        - mode
        - status
        - enabled_protocols
        - protocols
        - created_at
        - preview_opt_in
      properties:
        project_id: { type: string, format: uuid }
        owner_account_id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1 }
        mode: { $ref: "#/components/schemas/ProjectMode" }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        enabled_protocols:
          type: array
          items: { $ref: "#/components/schemas/ProtocolName" }
        protocols:
          type: array
          items: { $ref: "#/components/schemas/ProtocolState" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
        preview_opt_in: { type: boolean }
      description: |
        不提供 mode 变更字段。共享 Project 只允许目录中 stateful=false 的端点。
        preview_opt_in 控制 catalog preview/beta 端点是否准入。
    DeletionBlocker:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/BlockerKind" }
        reference_id: { type: string }
    Admission:
      type: object
      additionalProperties: false
      required: [allows_new_proxy]
      properties:
        allows_new_proxy: { type: boolean }
        project_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ProjectStatus" }
    Envelope:
      type: object
      required: [code, message, data, request_id, timestamp]
      properties:
        code: { type: string }
        message: { type: string }
        data: {}
        request_id: { type: string }
        timestamp: { type: string, format: date-time }
    ProjectEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Project" }
    ProjectListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/Project" }
    AdmissionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Admission" }
    DeleteBlockedEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code: { type: string, enum: [DELETE_BLOCKED] }
            data:
              type: object
              required: [blockers]
              properties:
                blockers:
                  type: array
                  items: { $ref: "#/components/schemas/DeletionBlocker" }
    PutBudgetRequest:
      type: object
      additionalProperties: false
      required: [hard_minor, soft_minor]
      properties:
        hard_minor: { type: integer, minimum: 0 }
        soft_minor: { type: integer, minimum: 0 }
        key_id: { type: string }
    AdmitBudgetRequest:
      type: object
      additionalProperties: false
      required: [amount_minor]
      properties:
        amount_minor: { type: integer, minimum: 1 }
        key_id: { type: string }
        protocol: { $ref: "#/components/schemas/ProtocolName" }
