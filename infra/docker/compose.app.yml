# Application services for the deploy stack (Layer A).
#
# Consumed only via `compose.deploy.yml` behind `make deploy` / `make deploy-down`.
# Images are produced by `make build`; this file never uses `build:` contexts.
# Local day-to-day development runs these processes on the host, not here.

services:
  proxy-gateway:
    image: ${TOKENMARKET_DEPLOY_IMAGE_PROXY_GATEWAY}
    stop_grace_period: 30s
    environment:
      PORT: "8080"
    ports:
      - target: 8080
        published: "${TOKENMARKET_DEPLOY_GATEWAY_HOST_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:8080/health/live >/dev/null
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    labels: &tokenmarket-app-labels
      com.tokenmarket.repository: tokenmarket
      com.tokenmarket.environment: ${TOKENMARKET_DEPLOY_ENVIRONMENT}
      com.tokenmarket.stack: deploy

  api-service:
    image: ${TOKENMARKET_DEPLOY_IMAGE_API_SERVICE}
    stop_grace_period: 30s
    environment:
      PORT: "8000"
      DATABASE_URL: ${TOKENMARKET_DEPLOY_APP_DATABASE_URL}
      # Feature 004 auth activation hooks. Values come only from the validated deploy
      # child environment (tools/workflow/deploy_env); empty strings are written there
      # explicitly when unset. Dispatcher, cleanup schedule metadata, TLS readiness,
      # SMS adapter, and trusted proxy/origin are fail-closed by
      # verify_auth_release_manifest when AUTH_RELEASE_MANIFEST is supplied;
      # secrets must never be committed.
      AUTH_BROWSER_ORIGINS: ${TOKENMARKET_DEPLOY_AUTH_BROWSER_ORIGINS}
      AUTH_TRUSTED_PROXY_CIDRS: ${TOKENMARKET_DEPLOY_AUTH_TRUSTED_PROXY_CIDRS}
      AUTH_SMS_ADAPTER: ${TOKENMARKET_DEPLOY_AUTH_SMS_ADAPTER}
      AUTH_DISPATCHER_LEASE_SECONDS: ${TOKENMARKET_DEPLOY_AUTH_DISPATCHER_LEASE_SECONDS}
      AUTH_DISPATCHER_DRAIN_SECONDS: ${TOKENMARKET_DEPLOY_AUTH_DISPATCHER_DRAIN_SECONDS}
      AUTH_DISPATCHER_ENABLED: ${TOKENMARKET_DEPLOY_AUTH_DISPATCHER_ENABLED}
      AUTH_CLEANUP_BATCH_SIZE: ${TOKENMARKET_DEPLOY_AUTH_CLEANUP_BATCH_SIZE}
      AUTH_CLEANUP_MAX_RUNTIME_SECONDS: ${TOKENMARKET_DEPLOY_AUTH_CLEANUP_MAX_RUNTIME_SECONDS}
      AUTH_TLS_READY: ${TOKENMARKET_DEPLOY_AUTH_TLS_READY}
    ports:
      - target: 8000
        published: "${TOKENMARKET_DEPLOY_API_HOST_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    labels: *tokenmarket-app-labels

  billing-service:
    image: ${TOKENMARKET_DEPLOY_IMAGE_BILLING_SERVICE}
    stop_grace_period: 30s
    environment:
      PORT: "8001"
      DATABASE_URL: ${TOKENMARKET_DEPLOY_APP_DATABASE_URL}
    ports:
      - target: 8001
        published: "${TOKENMARKET_DEPLOY_BILLING_HOST_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live')"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    labels: *tokenmarket-app-labels

  admin-service:
    image: ${TOKENMARKET_DEPLOY_IMAGE_ADMIN_SERVICE}
    stop_grace_period: 30s
    environment:
      PORT: "8002"
    ports:
      - target: 8002
        published: "${TOKENMARKET_DEPLOY_ADMIN_HOST_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live')"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    labels: *tokenmarket-app-labels

  frontend:
    image: ${TOKENMARKET_DEPLOY_IMAGE_FRONTEND}
    stop_grace_period: 15s
    ports:
      - target: 3000
        published: "${TOKENMARKET_DEPLOY_FRONTEND_HOST_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:3000/health/live >/dev/null
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    labels: *tokenmarket-app-labels
