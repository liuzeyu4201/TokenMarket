[project]
name = "api-service"
version = "0.1.0"
description = "TokenMarket API service scaffold (SF01)"
readme = "README.md"
requires-python = "==3.11.15"
license = { text = "Proprietary" }
authors = [
    { name = "TokenMarket Engineering" },
]
dependencies = [
    "alembic==1.14.1",
    "asyncpg==0.30.0",
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "prometheus-client==0.21.1",
    "psycopg2-binary==2.9.10",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.37",
    "uvicorn[standard]==0.34.0",
    "redis==5.2.1",
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "flake8==7.1.1",
    "httpx==0.28.1",
    "isort==6.0.0",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker/PostgreSQL or external services",
]
