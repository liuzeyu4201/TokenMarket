server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers for deploy same-origin SPA + /api proxy.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Same-origin API reverse proxy → api-service (Compose service DNS name).
    # Public browser origin never talks to the API host directly.
    location /api/ {
        proxy_pass http://api-service:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Cookie $http_cookie;
        # Preserve Set-Cookie from API for __Host- session cookies.
        proxy_pass_header Set-Cookie;

        # Re-apply security headers (nginx add_header does not inherit into locations
        # that set their own headers via proxy modules in all versions).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        # HTML shell must not be long-cached so deploy rollouts are visible promptly.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }

    location /health/live {
        access_log off;
        return 200 '{"service":"frontend","status":"alive","version":"0.1.0","request_id":"nginx"}';
        add_header Content-Type application/json;
    }
}
