openapi: 3.0.3
info:
  title: TokenMarket Project contract (SF01 source, implemented by SF10+)
  version: 1.0.0
  description: |
    版本化 Project 契约。本文件只定义形状与不变量，不挂载实现。
    mode 在创建后不可变；禁止 PATCH mode。
paths:
  /api/v1/projects:
    post:
      operationId: createProject
      summary: 创建 Project（后续 SF 实现）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /api/v1/projects/{project_id}:
    get:
      operationId: getProject
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
components:
  schemas:
    ProjectMode:
      type: string
      enum: [shared, dedicated]
    ProtocolName:
      type: string
      enum: [openai, anthropic, vertex]
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [display_name, mode, enabled_protocols]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 128 }
        mode: { $ref: "#/components/schemas/ProjectMode" }
        enabled_protocols:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProtocolName" }
        idempotency_key: { type: string, minLength: 1 }
    Project:
      type: object
      additionalProperties: false
      required: [project_id, owner_account_id, display_name, mode, enabled_protocols, created_at]
      properties:
        project_id: { type: string, minLength: 1 }
        owner_account_id: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        mode: { $ref: "#/components/schemas/ProjectMode" }
        enabled_protocols:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProtocolName" }
        created_at: { type: string, format: date-time }
      description: |
        不提供 mode 变更字段。共享 Project 只允许目录中 stateful=false 的端点。
